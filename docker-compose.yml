services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: atl-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: atl
      POSTGRES_DB: atl
    ports:
      - "5432:5432"
    volumes:
      - atl_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atl"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: atl-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - atl_qdrant_data:/qdrant/storage

volumes:
  atl_pg_data:
  atl_qdrant_data:
